*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#04060e;--surface:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.06);--text:#e8ecf4;--text2:rgba(255,255,255,0.55);--text3:rgba(255,255,255,0.25);--blue:#60a5fa;--green:#4ade80;--pink:#f472b6;--amber:#fbbf24;--red:#f87171;--purple:#a78bfa;--coupang:#e31837;--cyan:#22d3ee;--card:rgba(255,255,255,0.03);--card-b:rgba(255,255,255,0.06)}
body{background:var(--bg);font-family:'Noto Sans KR','Outfit',sans-serif;color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{display:none}input::placeholder{color:var(--text3)}

.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:linear-gradient(170deg,#04060e 0%,#0d1225 30%,#0a1628 60%,#04060e 100%)}

.card{background:var(--card);border:1px solid var(--card-b);border-radius:16px;padding:16px;margin-bottom:12px;backdrop-filter:blur(12px);transition:transform 0.2s}
.card:active{transform:scale(0.985)}

.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;cursor:pointer;color:var(--text3);font-size:10px;transition:all 0.2s}
.tab-item.active{color:var(--blue)}.tab-item .icon{font-size:20px;transition:transform 0.2s}.tab-item.active .icon{transform:scale(1.15)}

.ring-wrap{position:relative;flex-shrink:0}
.ring-wrap .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.btn-green{background:linear-gradient(135deg,#22c55e,#10b981);color:#fff}
.btn-amber{background:linear-gradient(135deg,#f59e0b,#f97316);color:#000}
.btn-ghost{background:rgba(255,255,255,0.05);color:var(--text2);border:1px solid var(--card-b)}
.btn-coupang{background:linear-gradient(135deg,#e31837,#ff4154);color:#fff;font-size:15px;padding:14px;box-shadow:0 4px 20px rgba(227,24,55,0.3)}

.banner-ad{border-radius:14px;padding:14px 16px;margin-bottom:14px;cursor:pointer;position:relative}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

.flex-b{display:flex;align-items:center;justify-content:space-between}

.pwa-banner{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;background:linear-gradient(135deg,#1e3a5f,#1a1a4e);border:1px solid rgba(96,165,250,0.25);border-radius:16px;padding:14px 16px;z-index:99;box-shadow:0 8px 32px rgba(0,0,0,0.5);display:none;animation:slideUp 0.3s ease}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes spin{to{transform:rotate(360deg)}}

async function getGPS() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error('GPS 미지원')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      err => reject(err),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 300000 }
    );
  });
}

async function getLocationName(lat, lon) {
  try {
    const res = await fetch(`https://api.openweathermap.org/geo/1.0/reverse?lat=${lat}&lon=${lon}&limit=1&appid=${OWM_API_KEY}`);
    const data = await res.json();
    if (data && data[0]) return data[0].local_names?.ko || data[0].name || '내 위치';
    return '내 위치';
  } catch(e) { return '내 위치'; }
}

async function fetchCurrentWeather(lat, lon) {
  const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${OWM_API_KEY}&units=metric&lang=kr`);
  if (!res.ok) throw new Error(`날씨 API 오류: ${res.status}`);
  return await res.json();
}

async function fetchForecast(lat, lon) {
  const res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${OWM_API_KEY}&units=metric&lang=kr`);
  if (!res.ok) throw new Error(`예보 API 오류: ${res.status}`);
  return await res.json();
}

async function fetchAirPollution(lat, lon) {
  const res = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${OWM_API_KEY}`);
  if (!res.ok) throw new Error(`대기질 API 오류: ${res.status}`);
  return await res.json();
}

function weatherIcon(id, icon) {
  if (id >= 200 && id < 300) return '⛈️';
  if (id >= 300 && id < 400) return '🌦️';
  if (id >= 500 && id < 511) return '🌧️';
  if (id === 511) return '🌨️';
  if (id >= 520 && id < 600) return '🌧️';
  if (id >= 600 && id < 700) return '🌨️';
  if (id >= 700 && id < 800) return '🌫️';
  if (id === 800) return icon?.includes('n') ? '🌙' : '☀️';
  if (id === 801) return '🌤️';
  if (id === 802) return '⛅';
  if (id >= 803) return '☁️';
  return '🌡️';
}

function parseCurrentWeather(data, airData) {
  const w = data.weather[0];
  const aqi = airData?.list?.[0]?.main?.aqi || 1;
  const pm10 = airData?.list?.[0]?.components?.pm10 || 0;
  const pm25 = airData?.list?.[0]?.components?.pm2_5 || 0;
  const dustLevel = aqi - 1;
  const dustLabels = ["좋음","보통","나쁨","매우나쁨","위험"];
  const dustColors = ["#4ade80","#facc15","#fb923c","#f87171","#dc2626"];
  
  let rainChance = 0;
  if (data.rain) rainChance = Math.min(95, 70 + (data.rain['1h'] || 0) * 10);
  else if (data.snow) rainChance = Math.min(95, 70 + (data.snow['1h'] || 0) * 10);
  else if (w.id >= 200 && w.id < 700) rainChance = 75;
  else if (data.clouds?.all > 80) rainChance = 30;
  else if (data.clouds?.all > 50) rainChance = 15;
  else rainChance = 5;

  return {
    icon: weatherIcon(w.id, w.icon),
    label: w.description,
    temp: Math.round(data.main.temp),
    feelsLike: Math.round(data.main.feels_like),
    humidity: data.main.humidity,
    windSpeed: Math.round(data.wind.speed * 10) / 10,
    clouds: data.clouds?.all || 0,
    rainChance,
    dustLevel,
    dustLabel: dustLabels[Math.min(dustLevel, 4)],
    dustColor: dustColors[Math.min(dustLevel, 4)],
    pm10: Math.round(pm10),
    pm25: Math.round(pm25)
  };
}

function parseForecastByDay(forecastData) {
  const days = {};
  forecastData.list.forEach(item => {
    const dateStr = item.dt_txt.split(' ')[0];
    if (!days[dateStr]) days[dateStr] = { temps:[], pops:[], conditions:[], humidities:[], winds:[], icons:[] };
    days[dateStr].temps.push(item.main.temp);
    days[dateStr].pops.push((item.pop || 0) * 100);
    days[dateStr].conditions.push(item.weather[0]);
    days[dateStr].humidities.push(item.main.humidity);
    days[dateStr].winds.push(item.wind.speed);
  });
  return Object.entries(days).map(([dateStr, data]) => {
    const maxPop = Math.round(Math.max(...data.pops));
    const avgTemp = Math.round(data.temps.reduce((a,b)=>a+b,0)/data.temps.length);
    const avgHumidity = Math.round(data.humidities.reduce((a,b)=>a+b,0)/data.humidities.length);
    const worstCondition = data.conditions.reduce((worst, c) => {
      if (c.id < worst.id || (c.id >= 200 && c.id < 700 && worst.id >= 800)) return c;
      return worst;
    }, data.conditions[0]);
    return { date: new Date(dateStr), dateStr, icon: weatherIcon(worstCondition.id, worstCondition.icon), label: worstCondition.description, temp: avgTemp, humidity: avgHumidity, rainChance: maxPop, windSpeed: Math.round(Math.max(...data.winds)*10)/10, dustLevel:1, dustLabel:"보통", dustColor:"#facc15" };
  });
}

// ─── 날씨 전체 로드 (자동 실행) ───
async function loadWeatherData() {
  state.weatherLoading = true;
  state.weatherError = null;
  render();

  try {
    let loc = state.location;
    if (!loc) {
      try {
        const pos = await getGPS();
        const name = await getLocationName(pos.lat, pos.lon);
        loc = { lat: pos.lat, lon: pos.lon, name };
      } catch(e) {
        // GPS 실패 시 서울 기본값
        loc = { lat: 37.5665, lon: 126.9780, name: '서울' };
        notify('📍 GPS 허용 안 됨 → 서울 기본 설정');
      }
      state.location = loc;
    }

    const [weatherRes, forecastRes, airRes] = await Promise.all([
      fetchCurrentWeather(loc.lat, loc.lon),
      fetchForecast(loc.lat, loc.lon),
      fetchAirPollution(loc.lat, loc.lon)
    ]);

    state.weatherData = parseCurrentWeather(weatherRes, airRes);
    state.forecastData = forecastRes;
    state.forecastDays = parseForecastByDay(forecastRes);
    state.airData = airRes;
    state.lastFetch = new Date();
    state.weatherError = null;
  } catch(e) {
    console.error('날씨 로드 실패:', e);
    state.weatherError = e.message;
  }
  state.weatherLoading = false;
  render();
}

async function refreshLocation() {
  state.location = null;
  notify('📍 위치 다시 찾는 중...');
  await loadWeatherData();
}

// 카카오맵에서 장소 검색 (OpenStreetMap Nominatim 무료 API 사용)
async function searchNearbyShops(keyword) {
  const S = state;
  if (!S.location) { notify('📍 위치를 먼저 확인해주세요'); return; }
  
  S.shopSearchLoading = true;
  S.shopSearchKeyword = keyword || '세차장';
  S.shopMapQuery = `${S.location.name} ${S.shopSearchKeyword}`;
  render();

  try {
    // Overpass API로 주변 세차장 검색 (OpenStreetMap 기반, 무료)
    const lat = S.location.lat;
    const lon = S.location.lon;
    const radius = 5000; // 5km 반경
    
    const query = `
      [out:json][timeout:10];
      (
        node["shop"="car_wash"](around:${radius},${lat},${lon});
        node["amenity"="car_wash"](around:${radius},${lat},${lon});
        way["shop"="car_wash"](around:${radius},${lat},${lon});
        way["amenity"="car_wash"](around:${radius},${lat},${lon});
      );
      out center body 20;
    `;
    
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query)
    });
    
    if (!res.ok) throw new Error('검색 실패');
    const data = await res.json();
    
    const shops = data.elements.map(el => {
      const elLat = el.lat || el.center?.lat;
      const elLon = el.lon || el.center?.lon;
      const dist = elLat ? getDistance(lat, lon, elLat, elLon) : null;
      return {
        name: el.tags?.name || el.tags?.['name:ko'] || '세차장',
        lat: elLat,
        lon: elLon,
        addr: el.tags?.['addr:full'] || el.tags?.['addr:street'] || el.tags?.['addr:city'] || '',
        phone: el.tags?.phone || el.tags?.['contact:phone'] || '',
        hours: el.tags?.opening_hours || '',
        type: el.tags?.['car_wash:type'] || el.tags?.self_service === 'yes' ? '셀프' : el.tags?.automated === 'yes' ? '자동' : '',
        website: el.tags?.website || '',
        dist: dist,
        distText: dist ? (dist < 1 ? `${Math.round(dist*1000)}m` : `${dist.toFixed(1)}km`) : ''
      };
    }).filter(s => s.lat && s.lon).sort((a,b) => (a.dist||999) - (b.dist||999));

    S.nearbyShops = shops;
    S.shopSearchDone = true;
    
    if (shops.length === 0) {
      notify('🔍 주변 세차장을 카카오맵에서 확인하세요');
    } else {
      notify(`📍 주변 세차장 ${shops.length}곳 발견!`);
    }
  } catch(e) {
    console.error('세차장 검색 실패:', e);
    S.nearbyShops = [];
    S.shopSearchDone = true;
    notify('🗺️ 카카오맵에서 직접 검색해보세요');
  }
  
  S.shopSearchLoading = false;
  render();
}

// 두 좌표 간 거리 계산 (km)
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI / 180;
  const dLon = (lon2-lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ═══ 세차 점수 / 등급 ═══
function washScore(w) {
  let s = 100;
  if (w.rainChance > 60) s -= 60;
  else if (w.rainChance > 30) s -= 30;
  else if (w.rainChance > 15) s -= 10;
  if (w.dustLevel >= 4) s -= 50;
  else if (w.dustLevel >= 3) s -= 40;
  else if (w.dustLevel >= 2) s -= 20;
  else if (w.dustLevel >= 1) s -= 5;
  if (w.temp < -5) s -= 35;
  else if (w.temp < 0) s -= 25;
  else if (w.temp < 5) s -= 10;
  if (w.humidity > 80) s -= 15;
  else if (w.humidity > 70) s -= 10;
  if (w.windSpeed > 10) s -= 15;
  else if (w.windSpeed > 7) s -= 5;
  return Math.max(0, Math.min(100, s));
}

function grade(s) {
  if (s>=85) return {g:"최고",emoji:"🚗✨",color:"#22c55e",bg:"rgba(34,197,94,0.1)",msg:"세차하기 완벽한 날!"};
  if (s>=65) return {g:"좋음",emoji:"🚙👍",color:"#3b82f6",bg:"rgba(59,130,246,0.1)",msg:"세차하기 좋은 날이에요."};
  if (s>=45) return {g:"보통",emoji:"🚕",color:"#eab308",bg:"rgba(234,179,8,0.1)",msg:"세차해도 괜찮아요."};
  if (s>=25) return {g:"비추천",emoji:"😥",color:"#f97316",bg:"rgba(249,115,22,0.1)",msg:"세차를 미루는 게 좋겠어요."};
  return {g:"금지",emoji:"🚫",color:"#ef4444",bg:"rgba(239,68,68,0.1)",msg:"오늘은 세차하지 마세요!"};
}

// ═══ 폴백 날씨 (API 실패 시) ═══
function genWeatherFallback(d) {
  const s=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(),h=((s*2654435761)>>>0)%1000;
  const c=[{label:"맑음",icon:"☀️",rain:5},{label:"구름 조금",icon:"⛅",rain:12},{label:"흐림",icon:"☁️",rain:25},{label:"비",icon:"🌧️",rain:80},{label:"폭우",icon:"⛈️",rain:95},{label:"눈",icon:"🌨️",rain:70},{label:"바람",icon:"💨",rain:15}];
  let i=h<300?0:h<480?1:h<620?2:h<780?3:h<870?4:h<940?5:6;const m=d.getMonth();
  if((m>=11||m<=1)&&h>600&&h<800)i=5;if(m>=6&&m<=8){if(h>500&&h<700)i=3;if(h>700&&h<800)i=4;}
  const t=Math.round(m>=3&&m<=5?10+h%15:m>=6&&m<=8?24+h%12:m>=9&&m<=10?8+h%14:-5+h%12),hu=30+h%50,du=h%5;
  const dL=["좋음","보통","나쁨","매우나쁨","위험"],dC=["#4ade80","#facc15","#fb923c","#f87171","#dc2626"];
  return{...c[i],temp:t,humidity:hu,windSpeed:3,dustLevel:du,dustLabel:dL[Math.min(du,4)],dustColor:dC[Math.min(du,4)],rainChance:Math.min(100,c[i].rain+(h%15))};
}

// ═══ 표시할 날씨 데이터 ═══
function getWeatherForDisplay() {
  const S = state;
  const isToday = ds(S.selectedDate) === ds(today);
  if (isToday && S.weatherData) return S.weatherData;
  if (S.forecastDays) {
    const selStr = S.selectedDate.toISOString().split('T')[0];
    const found = S.forecastDays.find(f => f.dateStr === selStr);
    if (found) return found;
  }
  return genWeatherFallback(S.selectedDate);
}

function getForecastArray() {
  const S = state;
  const result = [];
  if (S.weatherData) {
    result.push({ date: new Date(today), weather: S.weatherData, score: washScore(S.weatherData) });
  } else {
    const w = genWeatherFallback(today);
    result.push({ date: new Date(today), weather: w, score: washScore(w) });
  }
  if (S.forecastDays) {
    S.forecastDays.forEach(fd => {
      if (ds(fd.date) !== ds(today)) result.push({ date: fd.date, weather: fd, score: washScore(fd) });
    });
  } else {
    for (let i = 1; i < 7; i++) {
      const d = new Date(today); d.setDate(d.getDate()+i);
      const w = genWeatherFallback(d);
      result.push({ date: d, weather: w, score: washScore(w) });
    }
  }
  return result.slice(0, S.isPremium ? 14 : 7);
}

    // 배너

      const b = BANNERS[S.bannerIdx % BANNERS.length];
      html += `<div class="banner-ad" style="background:${b.bg}" onclick="setTab('shop')"><div class="flex-b">
        <div style="font-size:13px;font-weight:600;color:#fff;flex:1;line-height:1.4">${b.text}</div>
        <div style="background:rgba(255,255,255,0.25);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;margin-left:10px">${b.cta}</div></div>

    }

    // PRO 배너
    if (!S.isPremium) {
      html += `<div class="card" style="background:linear-gradient(135deg,rgba(234,179,8,0.1),rgba(245,158,11,0.05));border-color:rgba(234,179,8,0.2);cursor:pointer" onclick="state.showPremiumModal=true;render();">
        <div class="flex-c" style="gap:12px"><span style="font-size:26px">👑</span><div style="flex:1"><div style="font-size:14px;font-weight:800;color:var(--amber)">PRO 멤버십</div>
        <div style="font-size:11px;color:var(--text2);line-height:1.5">광고 제거 · 14일 예보 · 알림</div></div>
        <div style="background:#f59e0b;color:#000;font-weight:800;border-radius:10px;padding:8px 12px;font-size:12px">₩2,900/월</div></div></div>`;
    }

    // 세차 점수 카드
    if (!S.weatherLoading) {
      html += `<div class="card" style="background:${gr.bg};border-color:${gr.color}22;padding:18px"><div class="flex-c" style="gap:14px">${ringSVG(sc)}<div style="flex:1">
        <div style="font-size:11px;color:var(--text2);margin-bottom:3px">${ds(S.selectedDate)===ds(today)?"오늘의 세차 점수":`${S.selectedDate.getMonth()+1}/${S.selectedDate.getDate()} 세차 점수`}${isLive&&ds(S.selectedDate)===ds(today)?' 🔴':''}</div>
        <div class="flex-c" style="gap:8px;margin-bottom:4px"><span style="font-size:22px">${gr.emoji}</span><span style="font-size:18px;font-weight:800;color:${gr.color}">${gr.g}</span></div>
        <p style="font-size:12px;color:var(--text2);line-height:1.5">${gr.msg}</p></div></div></div>`;

      // 날씨 상세 그리드
      const wxItems = [
        {l:"날씨",v:`${w.icon} ${w.label}`},
        {l:"기온",v:`${w.temp}°C${w.feelsLike!=null?' (체감 '+w.feelsLike+'°C)':''}`},
        {l:"강수확률",v:`💧 ${w.rainChance}%`,c:w.rainChance>40?"var(--red)":""},
        {l:"습도",v:`${w.humidity}%`},
        {l:"미세먼지",v:`${w.dustLabel}${w.pm10?' ('+w.pm10+'㎍)':''}`,c:w.dustColor},
        {l:"세차 후 비",v:w.rainChance>30?"⚠️ 주의":"✅ 안전",c:w.rainChance>30?"var(--red)":"var(--green)"}
      ];
      html += `<div class="grid-3" style="margin-bottom:12px">${wxItems.map(it=>`<div class="wx-mini"><div class="label">${it.l}</div><div class="val" style="color:${it.c||'var(--text)'}">${it.v}</div></div>`).join('')}</div>`;

      // 추가 날씨 정보 (실시간)
      if (isLive && ds(S.selectedDate) === ds(today)) {
        html += `<div class="grid-3" style="margin-bottom:12px">
          <div class="wx-mini"><div class="label">바람</div><div class="val">💨 ${w.windSpeed}m/s</div></div>
          <div class="wx-mini"><div class="label">초미세먼지</div><div class="val" style="color:${w.dustColor}">${w.pm25}㎍/m³</div></div>
          <div class="wx-mini"><div class="label">구름</div><div class="val">☁️ ${w.clouds}%</div></div></div>`;
      }

      // 마지막 세차
      if (daysSince !== null) {
        const wn = daysSince > 14;
        html += `<div class="card flex-b" style="padding:12px 16px;${wn?'background:rgba(239,68,68,0.06);border-color:rgba(239,68,68,0.12)':''}">
          <div><div style="font-size:11px;color:var(--text3)">마지막 세차</div><div style="font-size:16px;font-weight:800;color:${wn?'var(--red)':'var(--text)'}">${daysSince}일 전</div></div>
          <div style="text-align:right"><div style="font-size:10px;color:var(--text3)">${lastW.type}</div>${wn?'<div style="font-size:11px;color:var(--red);font-weight:600;margin-top:2px">세차가 필요해요! 🚨</div>':''}</div></div>`;
      }

      // 베스트 세차일
      if (best) {
        html += `<div class="card" style="background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(59,130,246,0.04));border-color:rgba(34,197,94,0.1)">
          <div style="font-size:10px;color:var(--text3);margin-bottom:5px">📅 베스트 세차일</div><div class="flex-b"><div>
            <span style="font-size:16px;font-weight:800;color:var(--green)">${ds(best.date)===ds(today)?"오늘!":`${DAYS_KR[best.date.getDay()]}요일 (${best.date.getMonth()+1}/${best.date.getDate()})`}</span>
            <div style="font-size:11px;color:var(--text2);margin-top:2px">${best.weather.icon} ${best.weather.label} · ${best.weather.temp}°C · ${best.score}점</div>
          </div><div style="background:#22c55e;color:#000;font-weight:800;border-radius:10px;padding:6px 12px;font-size:12px">추천 ✓</div></div></div>`;
      }

      // 예보 바
      html += `<div style="margin-bottom:14px"><div style="font-size:11px;color:var(--text3);margin-bottom:8px">향후 ${fc.length}일 세차 지수 ${isLive?'<span style="color:var(--green)">(실시간)</span>':''}</div>
        <div class="forecast-bar">${fc.map((it,i)=>{const g2=grade(it.score),h=Math.max(14,(it.score/100)*60),sel=ds(it.date)===ds(S.selectedDate);
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;opacity:${sel?1:0.6}" onclick="state.selectedDate=new Date(${it.date.getTime()});render();">
            <span style="font-size:8px;color:${g2.color};font-weight:700">${it.score}</span>
            <div style="width:100%;min-width:14px;height:${h}px;border-radius:4px;background:linear-gradient(to top,${g2.color},${g2.color}88);${sel?'border:2px solid #fff':''}"></div>
            <span style="font-size:8px;color:var(--text3)">${i===0?"오늘":DAYS_KR[it.date.getDay()]}</span></div>`;}).join('')}</div></div>`;
    }

    // 쿠팡 추천 상품
    html += `<div style="margin-bottom:14px">
      <div style="background:rgba(227,24,55,0.1);border:1px solid rgba(227,24,55,0.2);border-radius:10px;padding:10px 14px;margin-bottom:10px;text-align:center"><span style="font-size:13px;font-weight:800;color:#ff4154">📢 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</span></div>
      <div class="flex-b" style="margin-bottom:8px">
      <div><span style="font-size:12px;font-weight:700">${isGoodDay?'🔥 오늘 세차 준비물':'🛒 인기 세차용품'}</span><span class="coupang-tag" style="margin-left:6px">쿠팡</span></div>
      <span style="font-size:10px;color:var(--blue);cursor:pointer" onclick="setTab('shop')">전체보기 →</span></div>
      ${isGoodDay?`<div style="background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.1);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:11px;color:var(--green)">✨ 세차 점수 ${sc}점! 지금 준비하세요</div>`:''}
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">${PRODUCTS.slice(0,4).map((p,i)=>
        `<div style="min-width:130px;background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--card-b);cursor:pointer;flex-shrink:0" onclick="openProduct(${i})">
          <div style="font-size:28px;margin-bottom:4px;text-align:center">${p.img}</div>
          <div style="font-size:10px;color:var(--text2);line-height:1.3;margin-bottom:3px;height:26px;overflow:hidden">${p.name}</div>

          ${p.rocket?'<div class="coupang-rocket">🚀 로켓배송</div>':''}</div>`).join('')}</div>
      <div style="text-align:center;margin-top:8px;font-size:12px;color:#ff4154;font-weight:700">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div></div>`;

    // 공유하기

      <div style="font-size:13px;font-weight:700;margin-bottom:2px">🔗 친구에게 공유하기</div>
      <div style="font-size:10px;color:var(--text3);margin-bottom:8px">세차 고민하는 친구에게 알려주세요!</div>
      <div class="share-btns">
        <button class="share-btn share-kakao" onclick="shareKakao()">💬 카카오톡</button>
        <button class="share-btn share-copy" onclick="copyLink()">🔗 링크 복사</button>
      </div></div>`;

    // 데이터 소스
    if (S.lastFetch) {
      html += `<div style="text-align:center;font-size:9px;color:var(--text3);padding:4px 0">
        데이터: OpenWeatherMap API · ${S.location?.name || ''} · ${S.lastFetch.toLocaleTimeString('ko-KR')}
        <span style="cursor:pointer;color:var(--blue)" onclick="loadWeatherData()"> 🔄</span></div>`;
    }
    html += `</div>`;
  }

  // ══════ CALENDAR ══════
  if (S.tab === "calendar") {
    const y=S.currentMonth.getFullYear(),m=S.currentMonth.getMonth(),fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();

            c+=`<div class="cal-day${iT?' today':''}${iS?' selected':''}" style="background:${iS?'':dayColor(d,y,m)};color:rgba(255,255,255,0.7)" onclick="state.selectedDate=new Date(${y},${m},${d});render();">${d}</div>`;}return c;})()}</div>
        <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap">

      <div class="card" style="background:${gr.bg};border-color:${gr.color}22;margin-top:8px">
        <div style="font-size:11px;color:var(--text2);margin-bottom:6px">${S.selectedDate.getMonth()+1}월 ${S.selectedDate.getDate()}일 (${DAYS_KR[S.selectedDate.getDay()]})</div>

  // ══════ SHOPS (실시간 세차장 검색 — 실제 작동) ══════
  if (S.tab === "shops") {
    const loc = S.location;

    const keyword = S.shopSearchKeyword || '세차장';
    const fullQ = encodeURIComponent(`${locName} ${keyword}`);

    const naverSearch = `https://m.map.naver.com/search2/search.naver?query=${fullQ}&sm=hty&style=v5`;
    const googleSearch = `https://www.google.com/maps/search/${encodeURIComponent(keyword)}/@${lat},${lon},14z`;
    
    html += `<div class="page">
      <h2 style="font-size:18px;font-weight:800;margin:6px 0 4px">📍 주변 세차장</h2>`;
    
    if (loc) {
      html += `<div class="flex-c" style="gap:6px;margin-bottom:10px">

      </div>`;
    }

    // 검색바
    html += `<div class="map-search-bar">
      <input class="map-search-input" id="shopSearchInput" type="text" placeholder="세차장, 셀프세차, 손세차..." value="${keyword}"

      <button class="map-search-btn" onclick="state.shopSearchKeyword=document.getElementById('shopSearchInput').value;render();">🔍</button>
    </div>`;

    // 카테고리 탭
    html += `<div class="map-tabs">
      ${['세차장','셀프세차','자동세차','손세차','디테일링','출장세차','광택','코팅'].map(k => 
        `<div class="map-tab${keyword===k?' active':''}" onclick="state.shopSearchKeyword='${k}';render();">${k}</div>`
      ).join('')}</div>`;

    // ─── 지도 카드 (Google Maps 임베드 — 가장 안정적) ───
    html += `<div class="map-container">
      <iframe src="https://maps.google.com/maps?q=${encodeURIComponent(keyword)}&ll=${lat},${lon}&z=14&output=embed&hl=ko" 
        allow="geolocation" loading="lazy" referrerpolicy="no-referrer"
        style="width:100%;height:100%;border:none;border-radius:16px"></iframe>
    </div>`;
    
    // 지도 앱 버튼들
    html += `<div style="display:flex;gap:6px;margin-bottom:14px">
      <a href="${kakaoSearch}" target="_blank" class="btn" style="flex:1;background:rgba(255,232,18,0.15);color:#ffe812;border:1px solid rgba(255,232,18,0.2);font-size:12px;padding:10px;text-decoration:none;text-align:center">🗺️ 카카오맵</a>
      <a href="${naverSearch}" target="_blank" class="btn" style="flex:1;background:rgba(30,200,80,0.12);color:var(--green);border:1px solid rgba(30,200,80,0.15);font-size:12px;padding:10px;text-decoration:none;text-align:center">🟢 네이버지도</a>
      <a href="${googleSearch}" target="_blank" class="btn" style="flex:1;background:rgba(96,165,250,0.12);color:var(--blue);border:1px solid rgba(96,165,250,0.15);font-size:12px;padding:10px;text-decoration:none;text-align:center">📍 구글맵</a>
    </div>`;

    // ─── 추천 세차장 (현재 위치 기반 안내) ───
    html += `<div style="font-size:13px;font-weight:800;margin-bottom:10px">🏪 "${keyword}" 검색 결과</div>`;

    // 세차 점수 기반 추천 메시지
    const todayW = getWeatherForDisplay();
    const todaySc = washScore(todayW);
    if (todaySc >= 65) {
      html += `<div class="card" style="background:rgba(34,197,94,0.06);border-color:rgba(34,197,94,0.1);padding:12px">
        <div style="font-size:12px;color:var(--green);font-weight:700">✨ 오늘 세차 점수 ${todaySc}점! 세차하기 좋은 날이에요</div>

        <div style="font-size:12px;color:var(--amber);font-weight:700">⚠️ 오늘 세차 점수 ${todaySc}점 — ${todayW.label}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:2px">세차를 미루거나 실내 세차장을 이용해보세요</div></div>`;
    }

    // 빠른 검색 바로가기
    const quickSearches = [
      {icon:'🏪',label:'셀프세차장',desc:'직접 세차하는 곳',q:'셀프세차장'},
      {icon:'🚿',label:'자동세차',desc:'기계 세차',q:'자동세차'},
      {icon:'🧽',label:'손세차',desc:'전문가 손세차',q:'손세차'},
      {icon:'✨',label:'디테일링',desc:'광택 · 코팅 전문',q:'자동차디테일링'},
      {icon:'🚗',label:'출장세차',desc:'찾아가는 세차',q:'출장세차'},
      {icon:'🅿️',label:'주유소세차',desc:'주유소 부설 세차',q:'주유소세차'}
    ];
    
    html += `<div class="grid-2" style="margin-bottom:14px">${quickSearches.map(qs => {
      const qUrl = `https://map.kakao.com/link/search/${encodeURIComponent(locName+' '+qs.q)}`;
      return `<a href="${qUrl}" target="_blank" style="text-decoration:none">

    // 세차 팁
    html += `<div class="card" style="padding:14px">
      <div style="font-size:12px;font-weight:700;margin-bottom:8px">💡 세차장 선택 팁</div>
      <div style="font-size:11px;color:var(--text2);line-height:1.8">

        🚗 <strong>출장세차</strong> — 내가 있는 곳으로 방문
      </div>
    </div>`;

    html += `</div>`;
  }

  // ══════ SHOP (쿠팡) ══════
  if (S.tab === "shop") {
    const fl = S.prodFilter==="전체" ? PRODUCTS : PRODUCTS.filter(p=>p.cat===S.prodFilter);
    html += `<div class="page"><div class="flex-b" style="margin:6px 0 4px"><div><h2 style="font-size:18px;font-weight:800;display:inline">🛒 세차용품</h2>
      <span class="coupang-tag" style="margin-left:6px">쿠팡 파트너스</span></div></div>
      <p style="font-size:11px;color:var(--text3);margin:4px 0 8px">최저가 · 로켓배송 · 구매 시 앱 지원에 도움이 됩니다</p>
      <div style="background:rgba(227,24,55,0.1);border:1px solid rgba(227,24,55,0.2);border-radius:10px;padding:10px 14px;margin-bottom:10px;text-align:center"><span style="font-size:13px;font-weight:800;color:#ff4154">📢 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</span></div>
      <div class="chips">${["전체","샴푸","워시미트","디테일러","코팅","타월","타이어","클리너"].map(f=>`<div class="chip${S.prodFilter===f?' active':''}" onclick="state.prodFilter='${f}';render();">${f}</div>`).join('')}</div>
      <div class="grid-2">${fl.map(p=>{const ri=PRODUCTS.indexOf(p);
        return `<div class="prod-card" onclick="openProduct(${ri})">
          ${p.badge?`<div class="prod-badge" style="background:${p.badge==="SALE"?"rgba(34,197,94,0.2);color:var(--green)":p.badge==="PREMIUM"?"rgba(245,158,11,0.25);color:var(--amber)":"rgba(227,24,55,0.15);color:#ff6b7a"}">${p.badge}</div>`:''}
          <div style="font-size:32px;margin-bottom:6px;text-align:center">${p.img}</div>
          <div style="font-size:11px;color:var(--text2);line-height:1.3;margin-bottom:4px;min-height:28px">${p.name}</div>
          <div class="flex-c" style="gap:4px;margin-bottom:2px"><span class="coupang-price" style="font-size:15px">₩${p.price}</span></div>
          <div class="flex-c" style="gap:4px"><span style="font-size:9px;color:var(--text3);text-decoration:line-through">₩${p.orig}</span><span style="font-size:10px;color:var(--red);font-weight:800">${p.disc}%↓</span></div>
          <div style="font-size:10px;color:var(--text2);margin-top:3px"><span class="stars">${starsHTML(p.rating)}</span> ${p.rating} (${p.reviews.toLocaleString()})</div>
          ${p.rocket?'<div class="coupang-rocket" style="margin-top:3px">🚀 로켓배송</div>':''}
          <div style="margin-top:6px;background:var(--coupang);text-align:center;border-radius:7px;padding:6px 0;font-size:11px;font-weight:700;color:#fff">쿠팡에서 보기</div></div>`;}).join('')}</div>
      <div style="text-align:center;padding:14px 0;font-size:13px;color:#ff4154;font-weight:800;line-height:1.6">📢 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div></div>`;
  }

  // ══════ MY CAR ══════
  if (S.tab === "mycar") {
    const total = S.washLogs.reduce((a,b)=>a+b.cost,0);
    html += `<div class="page"><h2 style="font-size:18px;font-weight:800;margin:6px 0 14px">🚗 내 차 관리</h2>
      <div class="grid-3" style="margin-bottom:14px">
        <div class="card"><div style="font-size:9px;color:var(--text3)">세차 횟수</div><div style="font-size:20px;font-weight:800;color:var(--blue);font-family:Outfit">${S.washLogs.length}회</div></div>
        <div class="card"><div style="font-size:9px;color:var(--text3)">총 비용</div><div style="font-size:14px;font-weight:800;color:var(--pink);font-family:Outfit">₩${total.toLocaleString()}</div></div>
        <div class="card"><div style="font-size:9px;color:var(--text3)">마지막</div><div style="font-size:14px;font-weight:800;color:${daysSince>14?'var(--red)':'var(--green)'};font-family:Outfit">${daysSince??"-"}일 전</div></div></div>
      <button class="btn btn-blue" style="margin-bottom:10px" onclick="state.showAddLog=!state.showAddLog;render();">✏️ 세차 기록 추가</button>
      ${S.showAddLog?`<div class="card"><div class="chips" style="margin-bottom:8px">${["셀프세차","자동세차","손세차","출장세차","디테일링"].map(t=>`<div class="chip${S.newLog.type===t?' active':''}" onclick="state.newLog.type='${t}';render();">${t}</div>`).join('')}</div>
        <input type="number" placeholder="비용 (원)" value="${S.newLog.cost}" oninput="state.newLog.cost=this.value" style="width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--card-b);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);outline:none;font-family:inherit;margin-bottom:6px"/>
        <input placeholder="메모 (선택)" value="${S.newLog.note}" oninput="state.newLog.note=this.value" style="width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--card-b);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);outline:none;font-family:inherit;margin-bottom:8px"/>
        <button class="btn btn-green" onclick="addLog()">저장</button></div>`:''}
      <div style="font-size:12px;font-weight:700;margin-bottom:8px">📋 세차 히스토리</div>
      ${S.washLogs.map(l=>`<div class="card flex-b" style="padding:10px 14px"><div><div style="font-size:13px;font-weight:600">${l.type}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:1px">${l.date}${l.note?' · '+l.note:''}</div></div>
        <div style="font-size:14px;font-weight:800;color:var(--pink);font-family:Outfit">₩${l.cost.toLocaleString()}</div></div>`).join('')}</div>`;
  }

  // ══════ PRODUCT DETAIL ══════
  if (S.selectedProduct !== null) {
    const p = PRODUCTS[S.selectedProduct];
    html += `<div class="modal-overlay" onclick="closeProduct()"><div class="modal-sheet" onclick="event.stopPropagation()">
      <div style="text-align:center;margin-bottom:14px"><div style="width:36px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:0 auto"></div></div>
      <div style="text-align:center;margin-bottom:16px"><div style="font-size:56px;margin-bottom:10px">${p.img}</div>
        ${p.badge?`<span style="display:inline-block;background:rgba(227,24,55,0.15);color:#ff6b7a;font-size:11px;font-weight:800;padding:3px 10px;border-radius:6px;margin-bottom:8px">${p.badge}</span>`:''}
        <h3 style="font-size:17px;font-weight:800;line-height:1.4">${p.name}</h3></div>
      <div style="background:rgba(227,24,55,0.06);border:1px solid rgba(227,24,55,0.12);border-radius:14px;padding:14px;margin-bottom:14px">
        <div class="flex-b"><div><span style="font-size:10px;color:var(--text3);text-decoration:line-through">정가 ₩${p.orig}</span>
          <span style="font-size:12px;color:var(--red);font-weight:800;margin-left:6px">${p.disc}% 할인</span></div>
          ${p.rocket?'<div class="coupang-rocket" style="font-size:12px">🚀 로켓배송</div>':'<div style="font-size:11px;color:var(--text3)">📦 판매자 배송</div>'}</div>
        <div style="margin-top:6px"><span class="coupang-price" style="font-size:28px">₩${p.price}</span></div></div>
      <div class="flex-c" style="gap:8px;margin-bottom:14px;justify-content:center"><span class="stars" style="font-size:14px">${starsHTML(p.rating)}</span>
        <span style="font-size:13px;font-weight:700">${p.rating}</span><span style="font-size:12px;color:var(--text2)">리뷰 ${p.reviews.toLocaleString()}개</span></div>
      <div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;margin-bottom:6px">📝 상품 설명</div>
        <p style="font-size:12px;color:var(--text2);line-height:1.7">${p.desc}</p></div>
      <div style="margin-bottom:18px"><div style="font-size:12px;font-weight:700;margin-bottom:6px">📋 상세 정보</div>
        ${p.specs.map(s=>`<div style="padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:11px;color:var(--text2)">${s}</div>`).join('')}</div>
      <button class="btn btn-coupang" onclick="goToCoupang(${S.selectedProduct})">🔗 쿠팡에서 최저가로 구매하기</button>
      <button class="btn btn-ghost" style="margin-top:8px;font-size:12px" onclick="goToCoupang(${S.selectedProduct})">쿠팡 앱에서 열기 →</button>
      <div style="text-align:center;margin-top:10px;font-size:12px;color:#ff4154;font-weight:700;line-height:1.6">📢 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>
      <button class="btn" style="background:transparent;color:var(--text3);font-size:12px;margin-top:8px" onclick="closeProduct()">닫기</button></div></div>`;
  }

  // ══════ PREMIUM MODAL ══════
  if (S.showPremiumModal) {
    html += `<div class="modal-overlay" style="align-items:center" onclick="state.showPremiumModal=false;render();">
      <div class="modal-box" onclick="event.stopPropagation()"><div style="text-align:center;margin-bottom:16px"><span style="font-size:40px">👑</span>
        <h3 style="font-size:20px;font-weight:800;color:var(--amber);margin:8px 0 4px">PRO 멤버십</h3></div>
        ${[{i:"🚫",t:"모든 광고 제거"},{i:"📅",t:"14일 세차 예보"},{i:"🔔",t:"푸시 알림"},{i:"🌫️",t:"미세먼지 예측"},{i:"📊",t:"세차 리포트"},{i:"🎫",t:"추가 할인"},{i:"🛒",t:"무료배송"},{i:"⚡",t:"우선 지원"}].map(it=>
          `<div class="flex-c" style="gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="font-size:16px">${it.i}</span><span style="font-size:13px">${it.t}</span></div>`).join('')}
        <div style="margin-top:16px"><button class="btn btn-amber" style="font-size:15px;padding:13px" onclick="state.isPremium=true;state.showPremiumModal=false;state.showBanner=false;notify('🎉 PRO 활성화!');render();">월 ₩2,900 시작</button>
        <div style="text-align:center;margin-top:6px;font-size:11px;color:var(--text3)">연간 ₩24,900 (30% 할인)</div>
        <button class="btn" style="background:transparent;color:var(--text3);font-size:12px;margin-top:6px" onclick="state.showPremiumModal=false;render();">나중에</button></div></div></div>`;
  }

  // Notification
  if (S.notification) html += `<div class="notif">${S.notification}</div>`;
  if (S.isPremium) html += `<div class="pro-badge">👑 PRO</div>`;

  // Tab Bar
  html += `<div class="tab-bar">${[{id:"home",icon:"🏠",l:"홈"},{id:"calendar",icon:"📅",l:"달력"},{id:"shops",icon:"📍",l:"세차장"},{id:"shop",icon:"🛒",l:"용품샵"},{id:"mycar",icon:"🚗",l:"내차"}].map(t=>
    `<div class="tab-item${S.tab===t.id?' active':''}" onclick="setTab('${t.id}')"><span class="icon">${t.icon}</span><span>${t.l}</span></div>`).join('')}</div>`;

  document.getElementById('app').innerHTML = html;
}

function addLog() {
  if(!state.newLog.cost) return;
  state.washLogs.unshift({date:today.toISOString().split('T')[0],type:state.newLog.type,cost:parseInt(state.newLog.cost),note:state.newLog.note});
  state.newLog={type:"셀프세차",cost:"",note:""};state.showAddLog=false;notify("✅ 저장 완료!");
}

// ═══ 자동 시작 ═══
// 배너 자동 전환
setInterval(()=>{ if(!state.isPremium){state.bannerIdx++;if(state.showBanner&&state.tab==="home")render();} },5000);

// 날씨 자동 갱신 (10분마다)
setInterval(()=>{ if(state.location) loadWeatherData(); },600000);

// 🚀 앱 시작 — 즉시 실행!
render();
loadWeatherData();

// ═══ PWA: 서비스워커 등록 ═══
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW registration failed:', err));
  });
}

// ═══ PWA: 설치 배너 ═══
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner() {
  // 이미 설치되었으면 표시 안 함
  if (window.matchMedia('(display-mode: standalone)').matches) return;
  if (localStorage.getItem('pwa-banner-dismissed')) return;
  
  const banner = document.createElement('div');
  banner.className = 'pwa-banner show';
  banner.id = 'pwaBanner';
  banner.innerHTML = `
    <span class="close" onclick="dismissInstallBanner()">✕</span>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">🚿</div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:800;color:#fff">세차의 날 앱 설치</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px">홈 화면에 추가하면 앱처럼 사용!</div>
      </div>
      <button onclick="installPWA()" style="background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">설치</button>
    </div>
  `;
  document.body.appendChild(banner);
}

async function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    notify('🎉 앱이 설치되었습니다!');
  }
  deferredPrompt = null;
  dismissInstallBanner();
}

function dismissInstallBanner() {
  const b = document.getElementById('pwaBanner');
  if (b) b.remove();
  localStorage.setItem('pwa-banner-dismissed', 'true');
}

// ═══ iOS 전용 설치 안내 ═══
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}
function isInStandaloneMode() {
  return ('standalone' in window.navigator) && (window.navigator.standalone);
}

if (isIOS() && !isInStandaloneMode()) {
  setTimeout(() => {
    if (localStorage.getItem('ios-banner-dismissed')) return;
    const iosBanner = document.createElement('div');
    iosBanner.className = 'pwa-banner show';
    iosBanner.id = 'iosBanner';
    iosBanner.innerHTML = `
      <span class="close" onclick="document.getElementById('iosBanner').remove();localStorage.setItem('ios-banner-dismissed','true');">✕</span>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">🚿</div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:800;color:#fff">홈 화면에 추가하기</div>
          <div style="font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px;line-height:1.4">하단의 <span style="font-size:14px">⎙</span> 공유 버튼 → "홈 화면에 추가"를 눌러주세요</div>
        </div>
      </div>
    `;
    document.body.appendChild(iosBanner);
  }, 3000);
}

// ═══ 앱 설치 상태 감지 ═══
window.addEventListener('appinstalled', () => {
  notify('🎉 세차의 날이 설치되었습니다!');
  deferredPrompt = null;
});
</script>
</body>
</html>
