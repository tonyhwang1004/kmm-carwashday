function genWeather(d){const s=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(),h=((s*2654435761)>>>0)%1000;
  const c=[{type:"sunny",label:"맑음",icon:"☀️",rain:5},{type:"partly",label:"구름 조금",icon:"⛅",rain:12},{type:"cloudy",label:"흐림",icon:"☁️",rain:25},
    {type:"rainy",label:"비",icon:"🌧️",rain:80},{type:"heavy",label:"폭우",icon:"⛈️",rain:95},{type:"snow",label:"눈",icon:"🌨️",rain:70},{type:"windy",label:"바람",icon:"💨",rain:15}];
  let i=h<300?0:h<480?1:h<620?2:h<780?3:h<870?4:h<940?5:6;const m=d.getMonth();
  if((m>=11||m<=1)&&h>600&&h<800)i=5;if(m>=6&&m<=8){if(h>500&&h<700)i=3;if(h>700&&h<800)i=4;}
  const t=Math.round(m>=3&&m<=5?10+h%15:m>=6&&m<=8?24+h%12:m>=9&&m<=10?8+h%14:-5+h%12),hu=30+h%50,du=h%5;
  const dL=["좋음","보통","나쁨","매우나쁨","위험"],dC=["#4ade80","#facc15","#fb923c","#f87171","#dc2626"];
  return{...c[i],temp:t,humidity:hu,dustLevel:du,dustLabel:dL[Math.min(du,4)],dustColor:dC[Math.min(du,4)],rainChance:Math.min(100,c[i].rain+(h%15))};}
function washScore(w){let s=100;if(w.rainChance>60)s-=60;else if(w.rainChance>30)s-=30;else if(w.rainChance>15)s-=10;
  if(w.dustLevel>=3)s-=40;else if(w.dustLevel>=2)s-=20;else if(w.dustLevel>=1)s-=5;if(w.temp<0)s-=25;else if(w.temp<5)s-=10;if(w.humidity>70)s-=10;if(w.type==="windy")s-=5;return Math.max(0,Math.min(100,s));}
function grade(s){if(s>=85)return{g:"최고",emoji:"🚗✨",color:"#22c55e",bg:"rgba(34,197,94,0.1)",msg:"세차하기 완벽한 날!"};
  if(s>=65)return{g:"좋음",emoji:"🚙👍",color:"#3b82f6",bg:"rgba(59,130,246,0.1)",msg:"세차하기 좋은 날이에요."};
  if(s>=45)return{g:"보통",emoji:"🚕",color:"#eab308",bg:"rgba(234,179,8,0.1)",msg:"세차해도 괜찮아요."};
  if(s>=25)return{g:"비추천",emoji:"😥",color:"#f97316",bg:"rgba(249,115,22,0.1)",msg:"세차를 미루는 게 좋겠어요."};
  return{g:"금지",emoji:"🚫",color:"#ef4444",bg:"rgba(239,68,68,0.1)",msg:"오늘은 세차하지 마세요!"};}
function dayColor(d,y,m){const s=washScore(genWeather(new Date(y,m,d)));if(s>=85)return"rgba(34,197,94,0.4)";if(s>=65)return"rgba(59,130,246,0.3)";if(s>=45)return"rgba(234,179,8,0.25)";if(s>=25)return"rgba(249,115,22,0.25)";return"rgba(239,68,68,0.25)";}
function notify(msg){state.notification=msg;render();setTimeout(()=>{state.notification=null;render();},2400);}

function ds(d){return d.toDateString();}
function starsHTML(r){return'★'.repeat(Math.floor(r))+(r%1>=0.5?'½':'')+'☆'.repeat(5-Math.ceil(r));}
function ringSVG(score,size=110){const g=grade(score),r=(size-12)/2,c=2*Math.PI*r,off=c-(score/100)*c;
  return`<div class="ring-wrap" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${g.color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 0.8s ease"/>
    </svg><div class="center"><span class="score-num" style="font-size:${size*0.24}px;color:${g.color}">${score}</span><span class="score-max">/ 100</span></div></div>`;}

  const fc=[];for(let i=0;i<(S.isPremium?14:7);i++){const d=new Date(today);d.setDate(d.getDate()+i);const ww=genWeather(d);fc.push({date:d,score:washScore(ww),weather:ww});}
  const best=fc.reduce((a,b)=>a.score>b.score?a:b);
  const isGoodDay=sc>=65;
  let html='';

  // HOME
  if(S.tab==="home"){
    html+=`<div class="page"><div style="text-align:center;padding:8px 0 14px">
      <div style="font-size:10px;letter-spacing:4px;color:var(--text3);text-transform:uppercase;font-family:Outfit">Car Wash Advisor</div>
      <h1 style="font-size:24px;font-weight:900;margin:4px 0 0;background:linear-gradient(135deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🚿 세차의 날</h1></div>`;
    if(S.showBanner&&!S.isPremium){const b=BANNERS[S.bannerIdx%BANNERS.length];

      ${[{i:"🚫",t:"모든 광고 제거"},{i:"📅",t:"14일 세차 예보"},{i:"🔔",t:"푸시 알림"},{i:"🌫️",t:"미세먼지 예측"},{i:"📊",t:"세차 리포트"},{i:"🎫",t:"추가 할인"},{i:"🛒",t:"무료배송"},{i:"⚡",t:"우선 지원"}].map(it=>
        `<div class="flex-c" style="gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="font-size:16px">${it.i}</span><span style="font-size:13px">${it.t}</span></div>`).join('')}
      <div style="margin-top:16px"><button class="btn btn-amber" style="font-size:15px;padding:13px" onclick="state.isPremium=true;state.showPremiumModal=false;state.showBanner=false;notify('🎉 PRO!');render();">월 ₩2,900 시작</button>
      <div style="text-align:center;margin-top:6px;font-size:11px;color:var(--text3)">연간 ₩24,900 (30% 할인)</div>
      <button class="btn" style="background:transparent;color:var(--text3);font-size:12px;margin-top:6px" onclick="state.showPremiumModal=false;render();">나중에</button></div></div></div>`;}

  if(S.notification)html+=`<div class="notif">${S.notification}</div>`;
  if(S.isPremium)html+=`<div class="pro-badge">👑 PRO</div>`;
  html+=`<div class="tab-bar">${[{id:"home",icon:"🏠",l:"홈"},{id:"calendar",icon:"📅",l:"달력"},{id:"shops",icon:"📍",l:"세차장"},{id:"shop",icon:"🛒",l:"용품샵"},{id:"mycar",icon:"🚗",l:"내차"}].map(t=>
    `<div class="tab-item${S.tab===t.id?' active':''}" onclick="setTab('${t.id}')"><span class="icon">${t.icon}</span><span>${t.l}</span></div>`).join('')}</div>`;
  document.getElementById('app').innerHTML=html;}

function addLog(){if(!state.newLog.cost)return;state.washLogs.unshift({date:today.toISOString().split('T')[0],type:state.newLog.type,cost:parseInt(state.newLog.cost),note:state.newLog.note});
  state.newLog={type:"셀프세차",cost:"",note:""};state.showAddLog=false;notify("✅ 저장 완료!");}
setInterval(()=>{if(!state.isPremium){state.bannerIdx++;if(state.showBanner&&state.tab==="home")render();}},5000);
render();
</script>
